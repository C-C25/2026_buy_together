services:
  db:
    image: postgres:15
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    environment:
      POSTGRES_USERNAME: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DATABASE: 'postgres'

  redis:
    image: redis
    ports:
      - '6379:6379'
    restart: always
